<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TropiCek – Skrining Penyakit Tropis</title>
<meta name="description" content="Simulasi aplikasi skrining awal (triase adaptif) 20 infeksi tropis & NTD dengan kuis interaktif.">
<meta name="theme-color" content="#5E5CE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#5E63D9;
  --ink:#3A2E6E; --ink2:#6E6898; --muted:#9A95BF;
  --card:#FFFFFF; --soft:#F6F3FF; --line:#E7E2FF; --tabbg:#EEEBFF;
  --purple:#8B4DFF; --purple2:#AE73FF; --purpleSh:#6427D6;
  --teal:#26C4B1; --teal2:#55E2D1; --tealSh:#148C7F;
  --gold:#FFC531; --goldSh:#E09A0E;
  --green:#2CC487; --yellow:#FFB82E; --orange:#FF8F3D; --red:#FF4B5C;
  --fh:'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --fb:'Nunito', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 20% 10%,#7B82F0 0,transparent 40%),radial-gradient(circle at 85% 90%,#7A5AE0 0,transparent 45%);
  font-family:var(--fb);color:var(--ink);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
button{font:inherit;color:inherit}
#phone{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#3B2F8F;isolation:isolate}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.bg-home{background:#6C5CE7}
.bg-quiz{background:linear-gradient(180deg,#4B44C4 0%,#6E4FDB 34%,#A85ED0 64%,#F07F9A 88%,#FFAE7E 100%)}
.bg-think{background:radial-gradient(circle at 50% 38%,#7A4FE8 0,#3C2A9C 55%,#221A63 100%)}
.bg-result{background:linear-gradient(180deg,#4B44C4 0%,#7550DE 30%,#B862CC 62%,#FF9A8F 100%)}
.bg-red{background:linear-gradient(180deg,#B3122E 0%,#E5313F 40%,#FF6A5B 100%)}

/* sparkles */
.spk{position:absolute;inset:0;pointer-events:none;z-index:0}
.spk i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.7);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}

/* HUD */
.hud{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 14px 4px;padding-top:max(10px,env(safe-area-inset-top));width:100%;max-width:1120px;margin:0 auto}
.icon-btn{width:40px;height:40px;flex:none;border:0;border-radius:13px;background:rgba(255,255,255,.22);color:#fff;font-size:22px;font-weight:800;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);backdrop-filter:blur(4px)}
.icon-btn:active{transform:translateY(2px)}
.stages{flex:1;display:flex;align-items:center;min-width:0}
.st{width:21px;height:21px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.25)}
.st.done{background:linear-gradient(#FFE27A,#FFB800);border-color:#fff;color:#8A4B00;font-size:13px;font-weight:900}
.st.cur{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3),0 0 16px #fff;transform:scale(1.15)}
.sl{flex:1;height:3px;min-width:3px;background:rgba(255,255,255,.3);border-radius:2px}
.sl.done{background:#FFD24A}
@media (max-width:370px){.st{width:18px;height:18px;font-size:9.5px}.hud{gap:6px;padding-left:10px;padding-right:10px}}
.htitle{flex:1;text-align:center;color:#fff;font-family:var(--fh);font-weight:600;font-size:17px;letter-spacing:.5px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:13px 16px;color:#fff;font-family:var(--fh);font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .08s,filter .2s;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.big{font-size:21px;padding:15px 16px;border-radius:20px}
.btn-purple{background:linear-gradient(180deg,var(--purple2),var(--purple));box-shadow:0 5px 0 var(--purpleSh),0 10px 20px rgba(80,30,180,.35)}
.btn-teal{background:linear-gradient(180deg,var(--teal2),var(--teal));box-shadow:0 5px 0 var(--tealSh),0 10px 18px rgba(20,140,127,.3)}
.btn-red{background:linear-gradient(180deg,#FF7280,#F23A4E);box-shadow:0 5px 0 #B0182C,0 10px 20px rgba(180,20,40,.35)}
.btn-white{background:#fff;color:#D61F3A;text-shadow:none;box-shadow:0 5px 0 #F3B9BF,0 10px 20px rgba(120,0,20,.3)}
.btn-ghost{background:rgba(255,255,255,.2);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn-dark{background:#5A0E1D;box-shadow:0 5px 0 #33040E}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn[disabled]{filter:grayscale(.85);opacity:.55;cursor:not-allowed;transform:none}
.btn small{font-family:var(--fb);font-weight:800;font-size:11px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:999px}

/* home */
.scene{position:absolute;inset:0;z-index:0}
.scene svg{width:100%;height:100%;display:block}
.home{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;padding:0 22px 22px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.ribbon{margin-top:6px;position:relative;background:linear-gradient(#FFFFFF,#EEEAFF);border-radius:22px;padding:12px 30px;text-align:center;box-shadow:0 6px 0 #C6BCF5,0 16px 30px rgba(40,20,120,.35)}
.ribbon::before,.ribbon::after{content:'';position:absolute;top:18px;width:26px;height:30px;background:#C6BCF5;z-index:-1}
.ribbon::before{left:-16px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.ribbon::after{right:-16px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.ribbon b{display:block;font-family:var(--fh);font-size:32px;font-weight:700;color:#5B3FD6;letter-spacing:.5px;line-height:1.1}
.ribbon b span{color:#FF8A5C}
.ribbon small{font-weight:800;font-size:12.5px;color:var(--ink2);letter-spacing:.3px}
.hero{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:14px}
.hero .bubble{max-width:200px;margin-bottom:96px}
.home-btns{width:100%;display:flex;flex-direction:column;gap:14px}
.disc{margin:14px 0 0;color:#fff;font-size:12px;font-weight:800;text-align:center;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.25)}

/* mascot */
.mascot{flex:none;animation:bob 3.2s ease-in-out infinite;overflow:visible}
.m-hero{width:150px;height:auto}
.m-sm{width:66px;height:auto}
.m-think{width:96px;height:auto}
.eyes{transform-box:view-box;transform-origin:60px 61px;animation:blink 4.5s infinite}
.m-arm{transform-box:view-box;transform-origin:92px 114px;animation:wave 2.6s ease-in-out infinite}
.mascot.hop{animation:hop .45s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes hop{30%{transform:translateY(-12px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}

.bubble{position:relative;background:#fff;border-radius:18px;padding:10px 13px;font-size:13.5px;font-weight:700;line-height:1.42;color:var(--ink);box-shadow:0 4px 0 rgba(60,30,140,.22)}
.bubble::before{content:'';position:absolute;left:-9px;bottom:16px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bubble p{margin:0}
.bubble b{color:var(--purple)}

/* quiz */
.qlayout{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column}
.qmain{flex:1;min-height:0;display:flex;flex-direction:column}
.mrow{position:relative;z-index:2;display:flex;align-items:flex-end;gap:8px;padding:0 16px}
.mrow .m-sm{width:52px}
.mrow .bubble{flex:1;margin-bottom:8px;padding:8px 12px;font-size:13px}
.cand{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11px;font-weight:800;color:#7B5BD6;white-space:nowrap}
.meter{flex:1;height:7px;background:#EEE8FF;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#B98CFF,#8B4DFF);border-radius:99px;transition:width .5s}
.qwrap{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 14px 10px;scrollbar-width:thin}
.card{position:relative;background:var(--card);border-radius:26px;padding:26px 14px 14px;box-shadow:0 8px 0 rgba(60,40,150,.22),0 22px 44px rgba(30,15,90,.28)}
.card + .card{margin-top:30px}
.tab{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--tabbg);color:#6B66A8;font-family:var(--fh);font-weight:600;font-size:13.5px;letter-spacing:1px;padding:8px 22px;border-radius:15px;box-shadow:0 4px 0 #D9D3FA,inset 0 -2px 0 rgba(0,0,0,.04);max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.qt{font-family:var(--fh);font-weight:600;font-size:17.5px;line-height:1.25;margin:0 0 2px;color:var(--ink)}
.qh{margin:0 0 10px;color:var(--muted);font-size:12.5px;font-weight:800}
.alertline{color:#E2283F}
.foot{position:relative;z-index:3;padding:6px 14px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.foot .btn.big{padding:13px 16px;font-size:19px}

.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--soft);border:2.5px solid var(--line);border-radius:16px;padding:7px 10px 7px 7px;cursor:pointer;position:relative;box-shadow:0 3px 0 var(--line);transition:transform .1s,border-color .15s,background .15s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .oe{flex:none;width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.05)}
.opt .ot{flex:1;min-width:0;font-weight:700;font-size:13.5px;line-height:1.3}
.opt .od{display:block;margin-top:2px;font-size:11.5px;font-weight:700;line-height:1.3;color:var(--muted)}
.tag{display:block;width:fit-content;max-width:100%;margin-top:3px;font-size:10px;font-weight:900;color:#7B5BD6;background:#ECE4FF;border-radius:999px;padding:1px 7px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2.5px solid #D6CFFA;background:#fff;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
/* tiles: ikon di atas, teks di bawah — 2 kolom di HP */
.opts.tiles{grid-template-columns:1fr 1fr}
.tiles .opt{flex-direction:column;justify-content:flex-start;text-align:center;gap:4px;padding:8px 6px 7px}
.tiles .opt .oe{width:32px;height:32px;font-size:18px;border-radius:11px}
.tiles .opt .ot{font-size:12.5px;line-height:1.25}
.tiles .opt .tag{margin:3px auto 0}
.tiles .opt .ck{position:absolute;top:5px;right:5px;width:19px;height:19px;font-size:10px;border-width:2px}
.tiles .opt.wide{grid-column:1/-1;flex-direction:row;justify-content:center;padding:7px 10px}
.tiles .opt.wide .ot{flex:none}
.tiles .opt.wide .ck{position:static}
.opts.tiles3{grid-template-columns:repeat(3,1fr);gap:6px}
.tiles3 .opt .ot{font-size:11.5px}
.tiles3 .opt .ck{display:none}
.opt.multi .ck{border-radius:9px}
.opt.on{border-color:var(--purple);background:#F3EBFF;box-shadow:0 3px 0 #CDB5FF}
.opt.on .ck{background:var(--purple);border-color:var(--purple)}
.opt.on .ck::after{content:'✓'}
.opt.danger .oe{background:#FFF0F1}
.opt.danger.on{border-color:var(--red);background:#FFF0F1;box-shadow:0 3px 0 #FFC2C8}
.opt.danger.on .ck{background:var(--red);border-color:var(--red)}
.opt.danger .tag{color:#D92C43;background:#FFE3E6}
.opt.safe{background:#F0FBF6;border-color:#CDEFDF;box-shadow:0 3px 0 #CDEFDF}
.opt.safe.on{border-color:var(--green);background:#E2F9EE;box-shadow:0 3px 0 #9FE3C3}
.opt.safe.on .ck{background:var(--green);border-color:var(--green)}

.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbox{border:0;border-radius:20px;padding:10px 8px 9px;text-align:center;color:#fff;cursor:pointer;position:relative;transition:transform .12s;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.cbox:last-child{grid-column:span 2}
.cbox .ce{font-size:30px;display:block;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.cbox b{font-family:var(--fh);font-weight:600;font-size:15px;display:block;margin-top:4px;line-height:1.15}
.cbox span.cs{display:block;font-size:11px;font-weight:800;opacity:.95;margin-top:2px;line-height:1.25}
.cbox:active{transform:translateY(3px)}
.cbox.on{transform:scale(1.03);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--purple)!important}
.cbox.on::after{content:'✓';position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--purple);font-weight:900;display:grid;place-items:center;text-shadow:none}
.cA{background:linear-gradient(160deg,#FF9F68,#FF6B6B);box-shadow:0 5px 0 #D9474F}
.cB{background:linear-gradient(160deg,#53DCCB,#2AA7C9);box-shadow:0 5px 0 #1C7F9C}
.cC{background:linear-gradient(160deg,#FFCB57,#FF9A3D);box-shadow:0 5px 0 #D97316}
.cD{background:linear-gradient(160deg,#F79AD6,#B36BFF);box-shadow:0 5px 0 #8448D1}
.cE{background:linear-gradient(160deg,#8D9BFF,#5B5BE6);box-shadow:0 5px 0 #3E3DB8}

/* inputs */
.fld{display:block;flex:1;min-width:0}
.fld > span{display:block;font-size:12.5px;font-weight:900;color:var(--ink2);margin:0 0 6px 4px}
.inp{display:flex;align-items:center;background:var(--soft);border:2.5px solid var(--line);border-radius:16px;padding:0 12px;transition:border-color .15s}
.inp:focus-within{border-color:var(--purple);background:#fff}
.inp input,.inp textarea{flex:1;min-width:0;border:0;background:transparent;outline:0;font-family:var(--fh);font-size:22px;font-weight:600;color:var(--ink);padding:10px 0;resize:none}
.inp textarea{font-family:var(--fb);font-size:15px;font-weight:700;min-height:56px}
.inp em{font-style:normal;font-weight:900;color:var(--muted)}
.two{display:flex;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12.5px;color:var(--ink2);cursor:pointer}
.chip:active{transform:scale(.95)}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;background:var(--soft);border:2.5px solid var(--line);border-radius:16px;font-weight:800;font-size:13.5px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--purple);flex:none}
.note{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ink2);background:#FFF7E6;border:2px dashed #FFD58A;border-radius:14px;padding:7px 10px;line-height:1.35}
.note.purple{background:#F3EEFF;border-color:#D8C8FF}

.thermo{display:flex;gap:14px;align-items:center}
.tbar{position:relative;width:34px;height:120px;flex:none;margin:2px 4px 16px}
.tbar .tube{position:absolute;left:8px;top:0;width:18px;height:102px;border-radius:12px;background:#F0ECFF;border:3px solid #E0D8FF;overflow:hidden}
.tbar .tfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#FF8A7A,#FF4B5C);transition:height .35s}
.tbar .bulb{position:absolute;left:0;bottom:-16px;width:34px;height:34px;border-radius:50%;background:#FF4B5C;border:3px solid #FFD0D5}
.tctl{flex:1;min-width:0}
.tval{display:flex;align-items:center;gap:8px}
.tval .inp{flex:1}
.tval .inp input{text-align:center;font-size:30px}
.rbtn{width:46px;height:46px;flex:none;border:0;border-radius:15px;background:linear-gradient(var(--teal2),var(--teal));color:#fff;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--tealSh)}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tealSh)}
.tstat{margin-top:10px;display:inline-block;font-weight:900;font-size:13px;padding:6px 12px;border-radius:999px;background:#EEE;color:#666}

.bmi{margin-top:12px;background:var(--soft);border-radius:18px;padding:10px 12px}
.bmi .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:900}
.bmi .row b{font-family:var(--fh);font-size:24px;color:var(--purple)}
.gauge{position:relative;height:12px;border-radius:99px;margin:12px 0 6px;background:linear-gradient(90deg,#6EC6FF 0 22%,#3DDC84 22% 51%,#FFC531 51% 62%,#FF6B6B 62%)}
.gauge i{position:absolute;top:-6px;width:6px;height:24px;border-radius:4px;background:var(--ink);box-shadow:0 0 0 2px #fff;transition:left .35s;transform:translateX(-50%)}
.glab{display:flex;justify-content:space-between;font-size:10.5px;font-weight:900;color:var(--muted)}

.bodywrap{display:flex;gap:10px;align-items:flex-start}
.bodysvg{width:46%;max-width:190px;flex:none}
.bodysvg svg{width:100%;height:auto;display:block}
.bp{cursor:pointer}
.bp > *{fill:#FFE0C7;stroke:#F0A97A;stroke-width:2;transition:fill .15s}
.bp:hover > *{fill:#FFD0A8}
.bp.on > *{fill:#FF6F7D;stroke:#E0405A;animation:pulse 1.4s infinite}
@keyframes pulse{50%{fill:#FF9AA4}}
.bside{flex:1;min-width:0}
.sel-list{display:flex;flex-wrap:wrap;gap:6px}
.sel-list span{background:#FFE7EA;color:#D63650;font-weight:900;font-size:11.5px;border-radius:999px;padding:4px 9px}
.empty{color:var(--muted);font-weight:800;font-size:12.5px}
.pain{margin-top:10px;background:var(--soft);border-radius:16px;padding:10px 8px}
.pain .pq{font-weight:900;font-size:12.5px;color:var(--ink2);margin:0 0 6px}
/* Skala wajah 0–10, vertikal (0 di atas): label | angka | wajah. Wajah & label di angka genap. Tanpa nilai awal. */
.fscale{display:grid;grid-template-columns:auto 34px 40px;grid-template-rows:repeat(11,30px);column-gap:8px;row-gap:4px;justify-content:center;align-items:center}
.fscale .fnum{grid-column:2;width:100%;height:100%;padding:0;border:2px solid var(--line);border-radius:9px;background:#fff;font-family:var(--fh);font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .1s,background .15s,border-color .15s}
.fscale .fnum:active{transform:translateY(2px);box-shadow:none}
.fscale .fnum.on{background:var(--fc);border-color:var(--fc);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.fscale .fnum.on.dk{color:var(--ink)}
.fscale .fface{grid-column:3;justify-self:center;width:38px;height:38px;border:0;border-radius:50%;background:var(--fc);font-size:22px;line-height:38px;padding:0;cursor:pointer;opacity:.72;transition:transform .15s,opacity .15s}
.fscale .fface.on{opacity:1;transform:scale(1.08);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--fc)}
.fscale .flab{grid-column:1;justify-self:end;max-width:64px;font-size:10.5px;font-weight:900;line-height:1.15;color:var(--ink2);text-align:right}
@media (min-width:640px){
  .fscale{grid-template-columns:auto 44px 48px;grid-template-rows:repeat(11,34px);column-gap:12px}
  .fscale .fnum{font-size:15px}
  .fscale .fface{width:46px;height:46px;font-size:27px;line-height:46px}
  .fscale .flab{max-width:none;font-size:12px;white-space:nowrap}
}
.nums{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.numcard{display:flex;align-items:center;gap:10px;background:var(--soft);border:2.5px solid var(--line);border-radius:16px;padding:8px 12px}
.numcard b{font-family:var(--fh);font-weight:600;font-size:24px;color:var(--ink);min-width:48px}
.numcard span{flex:1;font-weight:800;font-size:12.5px;color:var(--ink2)}
.numcard button{border:0;border-radius:12px;background:var(--purple);color:#fff;font-family:var(--fh);font-weight:600;font-size:13px;padding:8px 12px;min-height:40px;cursor:pointer}
.vrow{display:flex;gap:10px}
.fld .inp.age input{font-size:26px}
.frow .inp.age{height:58px;box-sizing:border-box}
.numcard b{user-select:all;-webkit-user-select:all}
.btn-jkn{background:linear-gradient(180deg,#5AA5FF,#2F73E6);box-shadow:0 5px 0 #1B4DAA,0 10px 20px rgba(30,80,200,.3)}
.row-links{display:flex;gap:10px}
.row-links .btn{flex:1}
.saveinfo{margin:0 0 10px;font-weight:800;font-size:13px;color:var(--ink2);line-height:1.4}

.photorow{display:flex;gap:10px;align-items:stretch}
.photo{position:relative;flex:1;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#F3EEFF,#FFE9E0);border:3px dashed #D8C8FF;min-height:96px;display:grid;place-items:center;text-align:center}
.photo img{width:100%;height:100%;max-height:150px;object-fit:cover;display:block}
.photo .ph{padding:10px;color:var(--ink2);font-weight:800;font-size:12px}
.photo .ph div{font-size:30px}
.photorow .btn{width:auto;flex:none;flex-direction:column;gap:2px;font-size:14px;padding:10px 14px;cursor:pointer}
.photorow .btn span{font-size:26px}
.frow{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.frow .fld.age{flex:0 0 112px}
.seg{display:flex;gap:4px;height:58px;padding:4px;background:var(--soft);border:2.5px solid var(--line);border-radius:16px}
.seg button{flex:1;min-width:0;border:0;border-radius:11px;background:transparent;font-family:var(--fh);font-weight:600;font-size:15px;color:var(--ink2);cursor:pointer}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--purple);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.subq{font-family:var(--fh);font-weight:600;font-size:14.5px;margin:12px 0 8px}
.scanline{position:absolute;left:0;right:0;height:4px;background:#5BF5E2;box-shadow:0 0 18px 6px rgba(91,245,226,.7);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:4%}to{top:94%}}
.scanbadge{position:absolute;left:10px;top:10px;background:rgba(30,20,80,.75);color:#fff;font-weight:900;font-size:11.5px;padding:5px 10px;border-radius:999px}

/* modal */
.ov{position:absolute;inset:0;z-index:50;background:rgba(25,15,70,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:26px 18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.ov .card{width:100%;max-width:460px;max-height:100%;overflow:visible;display:flex;flex-direction:column;padding-top:34px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.ov .mbody{overflow-y:auto;min-height:0}
.ov .card.yellow{background:#FFFBEA}
.ov .card.yellow .tab{background:#FFE69A;color:#8A5A00;box-shadow:0 4px 0 #F3C653}
.ov .card.red .tab{background:#FFD6DA;color:#C8102E;box-shadow:0 4px 0 #FFAAB3}
.xbtn{position:absolute;top:-14px;right:-6px;width:36px;height:36px;border:0;border-radius:12px;background:linear-gradient(#8E8BFF,#5F5BE8);color:#fff;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 4px 0 #3E3AB8}
.mbody{font-weight:700;font-size:14px;line-height:1.5}
.mbody h3{font-family:var(--fh);font-weight:600;font-size:19px;margin:0 0 8px}
.mbtns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-weight:900}
.setrow span{display:flex;align-items:center;gap:8px}
.tgl{width:52px;height:30px;border:0;border-radius:999px;background:#D5D0EE;position:relative;cursor:pointer;flex:none;transition:background .2s}
.tgl::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:left .2s}
.tgl.on{background:var(--purple)}
.tgl.on::after{left:26px}
.setsec{background:var(--soft);border-radius:16px;padding:12px;text-align:center;font-weight:900;color:var(--ink2);font-size:13px}
.pill-teal{display:block;margin:6px auto 12px;max-width:180px;background:linear-gradient(var(--teal2),var(--teal));color:#fff;border-radius:12px;padding:8px;font-family:var(--fh);font-weight:600;box-shadow:0 4px 0 var(--tealSh)}

/* thinking */
.think{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 22px 24px;overflow-y:auto}
.orbbox{position:relative;width:190px;height:200px;margin-top:6px;flex:none}
.orb{width:100%;height:100%;filter:drop-shadow(0 0 30px rgba(170,130,255,.8))}
.swirl{transform-box:view-box;transform-origin:95px 86px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orbEmo{position:absolute;left:0;right:0;top:58px;text-align:center;font-size:52px;transition:transform .15s}
.think .m-think{position:absolute;left:-58px;bottom:-6px}
.think .bubble{margin-top:16px;text-align:center}
.think .bubble::before{display:none}
.tsteps{list-style:none;padding:0;margin:18px 0 0;width:100%;display:flex;flex-direction:column;gap:8px}
.tsteps li{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.5);font-weight:800;font-size:13.5px;background:rgba(255,255,255,.08);border-radius:14px;padding:9px 12px;transition:all .3s}
.tsteps li .dot{width:22px;height:22px;flex:none;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:12px;color:#fff}
.tsteps li.run{color:#fff;background:rgba(255,255,255,.16)}
.tsteps li.run .dot{border-color:#FFD24A;border-top-color:transparent;animation:spin .8s linear infinite}
.tsteps li.ok{color:#fff}
.tsteps li.ok .dot{background:#3DDC84;border-color:#3DDC84}
.tsteps li.ok .dot::after{content:'✓';font-weight:900}
.candBig{margin-top:16px;color:#fff;font-weight:900;font-size:15px;background:rgba(0,0,0,.2);padding:8px 16px;border-radius:999px}
.candBig b{font-family:var(--fh);font-size:22px;color:#FFD24A}

/* result */
.rscroll{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 26px;padding-bottom:max(26px,env(safe-area-inset-bottom))}
.banner{position:relative;margin:4px auto 0;width:fit-content;max-width:100%;color:#fff;font-family:var(--fh);font-weight:700;font-size:20px;letter-spacing:1.5px;padding:10px 28px;border-radius:16px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.reveal{text-align:center;padding-top:34px}
.reveal .lead{font-weight:900;color:var(--ink2);font-size:13px}
.bigemo{width:100px;height:100px;margin:10px auto 6px;border-radius:30px;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,#FFF1C9,#FFD5E0);box-shadow:0 6px 0 #F2C4A8,inset 0 -4px 0 rgba(0,0,0,.05);animation:flip .9s cubic-bezier(.2,1.3,.4,1)}
@keyframes flip{from{transform:rotateY(180deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.reveal h2{font-family:var(--fh);font-weight:600;font-size:23px;margin:6px 0 4px;line-height:1.2}
.ring{--p:70;width:92px;height:92px;margin:10px auto 0;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--purple) calc(var(--p)*1%),#EEE8FF 0)}
.ring div{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:22px;color:var(--purple);line-height:1}
.ring div small{display:block;font-family:var(--fb);font-size:9.5px;font-weight:900;color:var(--muted)}
.rtag{display:inline-block;margin-top:10px;color:#fff;font-weight:900;font-size:12px;padding:5px 12px;border-radius:999px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px}
.bar .be{font-size:20px;width:28px;text-align:center;flex:none}
.bar .bn{flex:1;min-width:0}
.bar .bt{height:10px;border-radius:99px;background:#F0ECFF;overflow:hidden;margin-top:4px}
.bar .bt i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFB86B,#FF7E9A);width:0;transition:width 1s .3s}
.bar .bp2{font-family:var(--fh);font-weight:600;color:var(--ink2);flex:none}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.why li{font-size:13px;font-weight:700;background:var(--soft);border-radius:12px;padding:8px 10px;display:flex;gap:8px;line-height:1.35}
.why li::before{content:'🔎';flex:none}
.xval{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.xval div{font-size:12.5px;font-weight:800;color:#5B3FD6;background:#F1EBFF;border-radius:12px;padding:8px 10px;line-height:1.35}
.card.rcard{padding:0;overflow:hidden}
.rhead{padding:26px 16px 14px;color:#fff;text-align:center}
.rhead .re{font-size:40px;line-height:1}
.rhead h3{margin:6px 0 2px;font-family:var(--fh);font-weight:700;font-size:21px;letter-spacing:1px}
.rhead p{margin:0;font-weight:800;font-size:13px;opacity:.95}
.rbody{padding:14px 16px 18px}
.rbody h4{margin:12px 0 8px;font-family:var(--fh);font-weight:600;font-size:15px;color:var(--ink)}
.rbody h4:first-child{margin-top:0}
.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.todo li{display:flex;gap:9px;font-size:13.5px;font-weight:700;line-height:1.4}
.todo li::before{content:'✔';flex:none;width:20px;height:20px;border-radius:7px;background:#E2F9EE;color:#1A9A66;font-size:11px;font-weight:900;display:grid;place-items:center;margin-top:1px}
.place{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:16px;padding:10px 12px;margin:12px 0;font-weight:800;font-size:13px}
.place .pe{font-size:26px}
.place small{display:block;color:var(--muted);font-weight:800}
.warn{display:flex;gap:10px;border-radius:16px;padding:11px 12px;font-size:13px;font-weight:800;line-height:1.4;margin-top:10px}
.warn .wi{font-size:20px;flex:none}
.warn.y{background:#FFF6DB;border:2px solid #FFD873;color:#8A5A00}
.warn.r{background:#FFEDEF;border:2px solid #FFB3BC;color:#B3122E}
.warn.b{background:#EEF0FF;border:2px solid #CFD3FF;color:#3E44A8}
.btnrow{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.qrbox{margin-top:12px;background:var(--soft);border-radius:18px;padding:12px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);line-height:1.4}
.qrbox canvas{display:block;margin:0 auto 8px;width:100%;max-width:230px;aspect-ratio:1;image-rendering:pixelated;border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--line)}
.qrbox b{display:block;font-family:var(--fh);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:2px}
details.sum{margin-top:12px;background:var(--soft);border-radius:16px;padding:10px 12px}
details.sum summary{cursor:pointer;font-weight:900;font-size:13px;color:var(--ink2)}
details.sum pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;margin:10px 0 0;color:var(--ink)}
.scanpre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5;margin:0;color:var(--ink)}
.footdisc{margin:20px 6px 0;text-align:center;color:#fff;font-size:11.5px;font-weight:800;line-height:1.5;text-shadow:0 1px 2px rgba(0,0,0,.25)}

/* red */
.siren{font-size:70px;text-align:center;margin-top:4px}
.redh{margin:4px 0 6px;text-align:center;color:#fff;font-family:var(--fh);font-weight:700;font-size:30px;letter-spacing:2px}
.redp{margin:0 0 18px;text-align:center;color:#fff;font-weight:800;font-size:14.5px;line-height:1.45}
.rflag{display:flex;gap:10px;background:#FFF0F1;border-radius:16px;padding:10px;margin-bottom:10px}
.rflag .oe{font-size:26px;flex:none}
.rflag b{display:block;font-family:var(--fh);font-weight:600;font-size:15px;color:#C8102E}
.rflag span{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin-top:2px}
.rflag em{display:block;font-style:normal;font-size:12.5px;font-weight:800;color:#1A7A55;background:#E2F9EE;border-radius:10px;padding:6px 8px;margin-top:6px}
.fac{display:flex;flex-wrap:wrap;gap:8px}
.fac span{background:#FFE3E6;color:#C8102E;font-weight:900;font-size:12.5px;padding:6px 11px;border-radius:999px}

/* misc */
#toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:60;background:rgba(30,20,80,.92);color:#fff;font-weight:800;font-size:13.5px;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:all .3s;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.conf{position:absolute;top:-14px;width:9px;height:14px;border-radius:3px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* ===== Layout kolom hasil (HP: menumpuk) ===== */
.rcols,.redcols{width:100%;max-width:600px;margin:0 auto}
.rcol + .rcol{margin-top:30px}

/* ===== ≥ sm (640px): tablet & laptop ===== */
@media (min-width:640px){
  .hud{padding:16px 28px 8px}
  .st{width:30px;height:30px;font-size:15px}
  .st.done{font-size:16px}
  .sl{min-width:8px}
  .qlayout{width:100%;max-width:700px;margin:0 auto;padding:0 20px}
  .mrow{padding:4px 0 0}
  .mrow .m-sm{width:68px}
  .mrow .bubble{font-size:14px;padding:10px 14px}
  .qwrap{padding:26px 4px 12px;flex:0 1 auto}
  .card{padding:30px 20px 18px}
  .qt{font-size:20px}
  .opts{grid-template-columns:1fr 1fr;gap:10px}
  .opts.tiles{grid-template-columns:repeat(4,1fr)}
  .opts.tiles3{grid-template-columns:repeat(5,1fr)}
  .tiles .opt{padding:12px 8px 10px}
  .tiles .opt .oe{width:40px;height:40px;font-size:22px}
  .tiles .opt .ot{font-size:13px}
  .tiles3 .opt .ot{font-size:12px}
  .cgrid{grid-template-columns:repeat(6,1fr)}
  .cbox,.cbox:last-child{grid-column:span 2;padding:16px 10px 14px}
  .cbox:nth-child(n+4){grid-column:span 3}
  .cbox .ce{font-size:38px}
  .foot{padding:8px 4px 22px;display:flex;justify-content:flex-end}
  .foot .btn{width:auto;min-width:300px}
  .bodysvg{max-width:230px}
  .ribbon b{font-size:46px}
  .ribbon small{font-size:15px}
  .m-hero{width:210px}
  .hero .bubble{max-width:280px;font-size:15.5px;margin-bottom:150px}
  .home-btns{max-width:400px}
  .think{width:100%;max-width:560px;margin:0 auto}
  .rscroll{padding:16px 28px 34px}
}

/* ===== ≥ 960px: desktop dua kolom ===== */
@media (min-width:960px){
  .qlayout{max-width:1120px;display:grid;grid-template-columns:280px 1fr;gap:40px;padding:0 28px}
  .mrow{flex-direction:column;align-items:center;justify-content:flex-start;padding:44px 0 0}
  .qwrap{flex:0 1 auto}
  .mrow .m-sm{width:170px;order:2}
  .mrow .bubble{order:1;flex:none;width:100%;margin:0 0 18px;font-size:15.5px;padding:14px 16px}
  .mrow .bubble::before{left:50%;bottom:-9px;transform:translateX(-50%);border-width:9px 9px 0 9px;border-color:#fff transparent transparent transparent}
  .cand{font-size:12px;margin-top:8px}
  .qwrap{padding:34px 8px 12px}
  .rcols{max-width:1080px;display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-items:start}
  .rcol + .rcol{margin-top:0}
  .rcol > .card:first-child{margin-top:34px}
  .redcols{max-width:1000px;display:grid;grid-template-columns:1fr 1fr;gap:0 36px;align-items:start}
  .redcols .siren{font-size:96px;margin-top:40px}
  .redcols .redh{font-size:40px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

let AC;
function tone(seq){
  if(!S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f,d,type='sine',v=.07]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t += d*.75;
    });
  }catch(e){}
}

/* =========================================================
   INFERENCE ENGINE (simulasi Tahap 6)
   ========================================================= */
function bmiOf(a=S.ans){
  const h = num(a.h), w = num(a.w);
  if(!(h>=50 && h<=230 && w>=3 && w<=250)) return null;
  return w / Math.pow(h/100, 2);
}
function nutrition(a=S.ans){
  const b = bmiOf(a);
  if(b) return b < 18.5 ? 'kurus' : b >= 27 ? 'obes' : 'normal';
  return a.proxy === 'longgar' ? 'kurus' : a.proxy === 'gemuk' ? 'obes' : a.proxy === 'normal' ? 'normal' : null;
}
function compute(a=S.ans){
  const sc = {}, rs = {};
  Object.keys(DIS).forEach(k => { if(k!=='rabies'){ sc[k]=0; rs[k]=[]; } });
  const add = (d,p,r) => { if(!(d in sc)) return; sc[d]+=p; if(r && !rs[d].includes(r)) rs[d].push(r); };

  if(a.q2){
    CL[a.q2].members.forEach(d => add(d,10,'Keluhan utama: '+CL[a.q2].name));
    const o3 = Q3[a.q2].opts.find(o => o.id===a.q3);
    if(o3 && o3.id!=='x') add(o3.id,40,o3.r);
    if(Q4[a.q2]) a.q4.forEach(id => { const o = Q4[a.q2].opts.find(x=>x.id===id); if(o && o.d) add(o.d,20,o.r); });
  }
  a.q5.forEach(id => { const e = ECO.find(x=>x.id===id); if(e && e.pts) Object.entries(e.pts).forEach(([d,p]) => add(d,p,e.r)); });

  const t = num(a.temp);
  if(!a.noThermo && t >= 38){
    ['dbd','malaria','chik','lepto','skisto','tifoid','campak'].forEach(d => add(d,5,`Suhu terukur ${t.toFixed(1)} °C (demam)`));
    add('varicella',2);
  }
  const nut = nutrition(a);
  if(nut==='kurus'){ const r = bmiOf(a) ? 'IMT rendah (gizi kurang)' : 'Proksi gizi: pakaian longgar / BB turun drastis';
    add('tbc',10,r); add('kusta',6,r); add('sth',10,r); }
  if(nut==='obes') add('malaria',5,'Postur gemuk (prediktor malaria berat)');

  const b = new Set(a.body), pain = a.pain==null ? 0 : +a.pain; // Skala 0-10. TODO ST: konfirmasi ambang (dulu VAS >=60/100)
  if(['wrist_r','wrist_l','ankle_r','ankle_l'].some(x=>b.has(x))) add('chik', pain>=6?18:10, `Nyeri sendi pergelangan (skala ${pain}/10)`);
  if(b.has('ruq')) add('hepa',20,'Peta nyeri: perut kanan atas (area hati)');
  if(b.has('low')){ add('tifoid',12,'Peta nyeri: perut tengah/bawah'); add('amoeba',12,'Peta nyeri: perut tengah/bawah'); }
  if(b.has('luq')) add('tifoid',4,'Peta nyeri: ulu hati');
  const R = ['thigh_r','calf_r','ankle_r'].some(x=>b.has(x)), L = ['thigh_l','calf_l','ankle_l'].some(x=>b.has(x));
  if(R !== L) add('filaria',20,'Peta nyeri: tungkai asimetris (satu sisi)');
  if(b.has('calf_r') || b.has('calf_l')) add('lepto',12,'Peta nyeri: betis');
  if(b.has('chest')){ add('tbc',5,'Peta nyeri: dada'); add('ispa',5,'Peta nyeri: dada'); }
  if(b.has('head')){ add('dbd',5,'Peta nyeri: kepala / mata'); add('malaria',3,'Peta nyeri: kepala'); }

  a.findings.forEach(id => { const f = FIND.find(x=>x.id===id); if(f && f.d) add(f.d,25,f.r); });

  const pos = Object.entries(sc).filter(([,s])=>s>0);
  const Z = pos.reduce((z,[,s]) => z + Math.exp(s/20), 0);
  const ranked = pos.map(([id,s]) => ({id, s, p: Math.exp(s/20)/Z})).sort((x,y)=>y.s-x.s);
  return {sc, rs, ranked};
}
function meterInfo(){
  if(!S.ans.q2) return {n: S.ans.q1.includes('none') ? 19 : 20, p: 5};
  const r = compute();
  return {n: Math.max(1, r.ranked.filter(x=>x.p>=.05).length), p: Math.min(97, Math.round((r.ranked[0]?.p||0)*100))};
}
function drugFlags(a=S.ans){
  const t = a.q6 || '';
  const anti = /lopera|imodium|lodia|motilex|diatab|entrostop|attapulg|lomotil|diphenox/i.test(t);
  const nsaid = /ibupro|proris|aspirin|asetosal|aspilet|mefenam|ponstan|diklofenak|diclofenac|voltaren|piroxicam|naproxen|ketoprofen/i.test(t);
  return {
    // Blueprint Q6: hanya untuk dugaan diare/amebiasis. TODO DR: konfirmasi cakupan (pertanyaan terbuka #18).
    anti: anti && ['diare','amoeba'].includes(a.q3),
    nsaid: nsaid && a.q2==='A'
  };
}
function decide(r){
  const top = r.ranked[0];
  if(!top || top.s < 30) return {route:'yellow', unknown:true, notes:[]};
  let route = DIS[top.id].route; const notes = [];
  const t = num(S.ans.temp);
  if(route==='green' && !S.ans.noThermo && t >= 39.5){ route = 'yellow'; notes.push(`Rute dinaikkan ke KUNING karena suhu ${t.toFixed(1)} °C sangat tinggi.`); }
  return {route, unknown:false, notes};
}
function crossVal(r){
  const out = [], a = S.ans, sc = r.sc;
  // TODO DR+ST: Blueprint membandingkan petekie (DBD), tetapi belum ada pertanyaan tentang petekie.
  if(a.q2==='A' || a.q2==='C' || (sc.tifoid>0 && sc.dbd>0)){
    const w = sc.tifoid > sc.dbd ? 'Tifoid' : 'DBD';
    out.push(`Tifoid vs DBD: demam stepladder + nyeri perut vs demam pelana kuda + petekie → condong ke <b>${w}</b>`);
  }
  if(a.q2==='D' || (sc.kusta>0 && sc.tinea>0)){
    const w = sc.kusta > sc.tinea ? 'Kusta (mati rasa)' : 'Tinea (gatal saat berkeringat)';
    out.push(`Kusta vs Tinea: dipisahkan dari sensasi bercak → condong ke <b>${w}</b>`);
  }
  if(a.q2==='C' || (sc.diare>0 && sc.amoeba>0)){
    const w = sc.amoeba > sc.diare ? 'Amebiasis (darah-lendir + tenesmus)' : 'Diare akut (cair tanpa darah)';
    out.push(`Diare vs Amebiasis: deteksi lendir/darah & tenesmus → condong ke <b>${w}</b>`);
  }
  return out;
}

  a.q5 = a.q5.filter(id => { const e = ECO.find(x=>x.id===id); return !(e && e.show) || e.show(a); });

function flow(){
  const f = ['who','q1','q2','q3'];
  if(Q4[S.ans.q2]) f.push('q4');
  return f.concat(['q5','q6','q7','q8','q9','q10']);
}

function opts(key, list, multi, layout=''){
  const v = S.ans[key];
  return `<div class="opts ${layout}">${list.filter(o => !o.show || o.show(S.ans)).map(o => {
    const on = multi ? v.includes(o.id) : v===o.id;
    return `<button class="opt ${o.cls||''} ${on?'on':''} ${multi?'multi':''}" data-act="opt" data-key="${key}" data-id="${o.id}" data-multi="${multi?1:0}">

      <span class="ot">${o.t}${o.det?`<span class="od">${o.det}</span>`:''}</span>
      <span class="ck"></span></button>`;
  }).join('')}</div>`;
}

/* QR rangkuman. Isi QR = alamat aplikasi + jawaban pasien dalam kode ringkas (tanpa nama, NIK, atau foto).
   Tidak ada server: petugas yang memindai membuka halaman rangkuman yang dihitung di browsernya sendiri. */
const QR_ARR = ['q1','q4','q5','body','findings'];
const QR_STR = ['who','age','sex','q2','q3','q6','temp','h','w','proxy'];
function packAns(a){
  const o = {};
  [...QR_ARR, ...QR_STR, 'noThermo', 'pain', 'ts'].forEach(k => {
    const v = a[k];
    if(v===null || v==='' || v===false || (Array.isArray(v) && !v.length)) return;
    o[k] = v;
  });
  let bin = ''; new TextEncoder().encode(JSON.stringify(o)).forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unpackAns(t){
  const bin = atob(t.replace(/-/g,'+').replace(/_/g,'/'));
  const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  if(!o || typeof o !== 'object') throw new Error('bad');
  const a = blankAns();
  QR_ARR.forEach(k => { if(Array.isArray(o[k])) a[k] = o[k].filter(x => typeof x==='string').slice(0,40); });
  QR_STR.forEach(k => { if(typeof o[k]==='string') a[k] = o[k].slice(0,200); });
  a.noThermo = o.noThermo === true;
  a.pain = Number.isInteger(o.pain) && o.pain>=0 && o.pain<=10 ? o.pain : null;
  if(Number.isFinite(o.ts)) a.ts = o.ts;
  return a;
}
const SCAN_HASH = '#ringkasan=';
function scanURL(){ return location.href.split('#')[0] + SCAN_HASH + packAns(S.ans); }
function drawQR(cv, text){
  let qr = null;
  try{ qr = qrcode(0, 'L'); qr.addData(text); qr.make(); }catch(e){ qr = null; }
  if(!qr) return false;
  const n = qr.getModuleCount(), q = 4, m = Math.max(2, Math.floor(460/(n+2*q)));
  cv.width = cv.height = (n+2*q)*m;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#1C1250';
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(qr.isDark(y,x)) ctx.fillRect((x+q)*m,(y+q)*m,m,m);
  return true;
}

        <p class="lead">Gejalamu belum cocok dengan satu pola. Lebih aman diperiksa langsung, ya!</p>`

      ${others.map(o=>`<div class="bar"><span class="be">${DIS[o.id].emo}</span><span class="bn">${DIS[o.id].name}<div class="bt"><i data-w="${Math.round(o.p*100)}"></i></div></span><span class="bp2">${Math.round(o.p*100)}%</span></div>`).join('')}
    </div></div>` : ''}

    ${!d.unknown ? `<div class="card"><div class="tab">KENAPA AKU MENEBAK INI?</div>
      <ul class="why">${r.rs[top.id].slice(0,6).map(x=>`<li>${x}</li>`).join('')}</ul>
      ${xv.length ? `<div class="xval">${xv.map(x=>`<div>⚖️ ${x}</div>`).join('')}</div>` : ''}

    </div><div class="rcol">

        <a class="btn btn-jkn" style="margin-top:14px" href="${jknURL()}" target="_blank" rel="noopener">📅 Buat janji dokter (Mobile JKN)</a>
        ${d.route!=='green' ? `<div class="qrbox"><canvas id="qr" width="232" height="232" aria-label="QR rangkuman untuk petugas"></canvas><b>QR Rangkuman</b>Tunjukkan ke petugas. Petugas yang memindai melihat rangkuman kondisimu dan saran penanganan. Datanya ada di QR ini, tidak dikirim atau disimpan di server.</div>` : ''}
        <details class="sum"><summary>📄 Lihat rangkuman lengkap</summary><pre>${esc(sum)}</pre></details>
      </div>
    </div>

    ${warns.length ? `<div class="card"><div class="tab">CATATAN PENTING</div>${warns.map(w=>`<div class="warn ${w[0]}"><span class="wi">${w[1]}</span><span>${w[2]}</span></div>`).join('')}</div>` : ''}

      <button class="btn btn-teal" data-act="copy">📋 Salin Rangkuman</button>

  S.lastSummary = sum;
  const cv = $('#qr'); if(cv && !drawQR(cv, scanURL())){ cv.closest('.qrbox').remove(); }
  setTimeout(()=>document.querySelectorAll('.bar .bt i').forEach(i=>i.style.width = i.dataset.w + '%'), 60);

}

/* =========================================================
   RENDER: HALAMAN RANGKUMAN (hasil pindai QR, untuk petugas)
   ========================================================= */
function renderScan(){
  let a = null;
  try{ a = unpackAns(location.hash.slice(SCAN_HASH.length)); }catch(e){ a = null; }
  if(!a){
    screen.className = 'screen bg-result';
    screen.innerHTML = `<div class="hud"><button class="icon-btn" data-act="home" aria-label="Beranda">⌂</button><div class="htitle">Rangkuman Pasien</div></div>
    <div class="rscroll"><div class="card" style="margin-top:34px"><div class="tab">TIDAK BISA DIBACA</div><p class="saveinfo">Kode QR ini tidak lengkap atau rusak. Minta pasien menampilkan QR dari halaman hasil sekali lagi.</p></div></div>`;
    return;
  }
  S.ans = a;
  const r = compute(), d = decide(r), R = ROUTES[d.route];
  const sum = summary(r, d), {todo, warns} = adviceFor(r, d);
  screen.className = 'screen bg-result';
  screen.innerHTML = `${sparkles(10)}
  <div class="hud"><button class="icon-btn" data-act="home" aria-label="Beranda">⌂</button><div class="htitle">Rangkuman Pasien</div></div>
  <div class="rscroll">
    <div class="banner" style="background:linear-gradient(${R.c1},${R.c2})">${R.emo} ${R.name}</div>
    <div class="rcols"><div class="rcol">
    <div class="card" style="margin-top:34px"><div class="tab">KONDISI PASIEN</div><pre class="scanpre">${esc(sum)}</pre></div>
    </div><div class="rcol">
    <div class="card"><div class="tab">SARAN PENANGANAN</div>
      <ul class="todo">${todo.filter(x=>!/QR rangkuman/.test(x)).map(x=>`<li>${x}</li>`).join('')}</ul>
    </div>
    ${warns.length ? `<div class="card"><div class="tab">CATATAN PENTING</div>${warns.map(w=>`<div class="warn ${w[0]}"><span class="wi">${w[1]}</span><span>${w[2]}</span></div>`).join('')}</div>` : ''}
    <div class="btnrow"><button class="btn btn-teal" data-act="home">Buka TropiCek</button></div>
    </div></div>
    <p class="footdisc">⚠️ Ini hasil skrining awal dari jawaban pasien (simulasi untuk demonstrasi), bukan diagnosis dokter.</p>
  </div>`;
}

/* =========================================================
   MODALS
   ========================================================= */
let MODAL_FNS = [];
function modal({tone='', tab='', body='', actions=[], close=true}){
  closeModal();
  MODAL_FNS = actions.map(a=>a.fn);
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="card ${tone}">${tab?`<div class="tab">${tab}</div>`:''}${close?'<button class="xbtn" data-act="mclose" aria-label="Tutup">✕</button>':''}
    <div class="mbody">${body}</div>${actions.length?`<div class="mbtns">${actions.map((a,i)=>`<button class="btn ${a.cls||'btn-purple'}" data-act="mfn" data-i="${i}">${a.label}</button>`).join('')}</div>`:''}</div>`;
  ov.addEventListener('click', e => { if(e.target===ov && close) closeModal(); });
  $('#phone').appendChild(ov);
}
function closeModal(){ const o = $('#ov'); if(o) o.remove(); }

function openSettings(){
  const s = S.settings;
  modal({tab:'PENGATURAN', body:`
    <div class="setrow"><span>🔊 Suara</span><button class="tgl ${s.sound?'on':''}" data-act="tgl" data-k="sound" aria-label="Suara"></button></div>
    <div class="setrow"><span>📳 Getar</span><button class="tgl ${s.vib?'on':''}" data-act="tgl" data-k="vib" aria-label="Getar"></button></div>

    <div class="setsec">Bahasa<span class="pill-teal">Indonesia</span>Wilayah<span class="pill-teal" style="margin-bottom:0">Indonesia</span></div>`});
}
function openLogin(){
  modal({tab:'MASUK / DAFTAR', body:`
    <p class="saveinfo">Masuk itu <b>opsional</b>, kamu tetap bisa skrining tanpa akun. Ini simulasi: data tidak dikirim ke mana pun dan hanya nama yang diingat di perangkat ini.</p>
    <label class="fld"><span>Nama panggilan</span><div class="inp"><input id="lgName" maxlength="40" placeholder="mis. Sari" autocomplete="off"></div></label>
    <label class="fld" style="margin-top:10px"><span>Email</span><div class="inp"><input id="lgMail" type="email" placeholder="nama@email.com" autocomplete="off"></div></label>
    <label class="fld" style="margin-top:10px"><span>Kata sandi</span><div class="inp"><input id="lgPass" type="password" placeholder="••••••••" autocomplete="off"></div></label>`,
    actions:[
      {label:'Masuk (simulasi)',cls:'btn-purple',fn:()=>{
        const n = ($('#lgName').value||'').trim().slice(0,40);
        if(!n){ toast('Isi nama panggilan dulu ya'); return; }
        S.user = {name:n}; try{ localStorage.setItem('tropicek_user', JSON.stringify(S.user)); }catch(e){}
        closeModal(); toast(`Halo, ${n}! 👋`); refreshAuthUI(); }},
      {label:'Lanjut tanpa akun',cls:'btn-teal',fn:closeModal}]});
}
function openProfile(){
  modal({tab:'PROFIL', body:`<h3>Halo, ${esc(S.user.name)}! 👋</h3>`,
    actions:[{label:'Keluar',cls:'btn-teal',fn:()=>{ S.user = null; try{ localStorage.removeItem('tropicek_user'); }catch(e){} closeModal(); refreshAuthUI(); toast('Kamu sudah keluar'); }}]});
}
function refreshAuthUI(){
  if(screen.classList.contains('bg-home')) renderHome();
}
function openProxy(){
  modal({tone:'yellow', tab:'PROKSI GIZI', body:`<h3>Tidak apa-apa! 😊<br>Secara fisik, apakah Anda merasa:</h3>
    <div class="opts">
      <button class="opt small ${S.ans.proxy==='longgar'?'on':''}" data-act="proxy" data-v="longgar"><span class="oe">👕</span><span class="ot">Pakaian longgar / BB turun drastis</span><span class="ck"></span></button>
      <button class="opt small ${S.ans.proxy==='gemuk'?'on':''}" data-act="proxy" data-v="gemuk"><span class="oe">🧸</span><span class="ot">Postur cenderung gemuk</span><span class="ck"></span></button>
      <button class="opt small ${S.ans.proxy==='normal'?'on':''}" data-act="proxy" data-v="normal"><span class="oe">🙂</span><span class="ot">Normal</span><span class="ck"></span></button>
    </div>`});
}

/* =========================================================
   EVENTS
   ========================================================= */
function start(){ S.i = 0; S.ans = blankAns(); renderQuiz(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'start': SFX.tap(); start(); break;
    case 'settings': SFX.tap(); openSettings(); break;
    case 'opt': pick(el.dataset.key, el.dataset.id, el.dataset.multi==='1'); break;
    case 'next': next(); break;
    case 'back': SFX.tap(); if(screen.classList.contains('bg-red')) renderQuiz(); else back(); break;
    case 'home': SFX.tap(); renderHome(); break;
    case 'restart': SFX.tap(); start(); break;
    case 'pain': S.ans.pain = +el.dataset.v; SFX.tap(); vib(); refreshBody(); break;
    case 'bp': {
      const id = el.dataset.id, arr = S.ans.body;
      S.ans.body = arr.includes(id) ? arr.filter(x=>x!==id) : [...arr,id];
      SFX.tap(); vib(); refreshBody(); hopMascot(); break; }
    case 'tstep': {
      let t = num(S.ans.temp); if(isNaN(t)) t = 37;
      t = Math.max(34, Math.min(43, Math.round((t + parseFloat(el.dataset.v))*10)/10));
      S.ans.temp = t.toFixed(1).replace('.',','); $('#temp').value = S.ans.temp; SFX.tap(); updTemp(); refresh(); break; }
    case 'drug': {
      const v = S.ans.q6.trim(); S.ans.q6 = v ? v.replace(/[,\s]+$/,'') + ', ' + el.dataset.d : el.dataset.d;
      $('#q6').value = S.ans.q6; SFX.tap(); break; }
    case 'noscale': SFX.tap(); openProxy(); break;
    case 'proxy': S.ans.proxy = el.dataset.v; SFX.tap(); closeModal(); refreshBody(); break;
    case 'tgl': {
      const k = el.dataset.k; S.settings[k] = !S.settings[k]; el.classList.toggle('on', S.settings[k]);
      SFX.tap(); break; }
    case 'chronic': break; // TODO: jalur kronis belum ada (menunggu docs/Blueprint-Kronis.md dari DR). Sengaja tidak mengarah ke mana pun.
    case 'login': SFX.tap(); openLogin(); break;
    case 'profile': SFX.tap(); openProfile(); break;
    case 'copynum': { const n = el.dataset.n; copyText(n, () => toast(`Nomor ${n} tersalin`)); break; }
    case 'mclose': closeModal(); break;
    case 'mfn': { const f = MODAL_FNS[+el.dataset.i]; f && f(); break; }
    case 'copy': {
      const txt = S.lastSummary || '';
      const done = () => { SFX.ding(); toast('📋 Rangkuman tersalin!'); };
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt, done));
      else fallbackCopy(txt, done);
      break; }
  }
});
document.addEventListener('change', e => {
  if(e.target.matches('[data-act="nothermo"]')){
    S.ans.noThermo = e.target.checked; SFX.tap(); refreshBody();
  }
});
function copyText(txt, done){
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Gagal menyalin — buka "Lihat rangkuman lengkap".'); }
  ta.remove();
}

function route(){ if(location.hash.startsWith(SCAN_HASH)) renderScan(); else renderHome(); }
window.addEventListener('hashchange', route);
route();
</script>
