[dependency-groups]
dev = [
    "prek>=0.4.14,<1.0.0",
    "typer>=0.27.1,<1.0.0",
    "zizmor>=1.29.0",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
# Indonesian and medical vocabulary used by the docs, the quiz content JSON and
# the code. The typos hook checks against an English dictionary, so every
# Indonesian word in AGENTS.md, docs/ and backend/app/triage/content/ reads as a
# misspelling. Listing them keeps the hook useful for real typos.
[tool.typos.default.extend-words]
absolut = "absolut"
analisis = "analisis"
faktor = "faktor"
fase = "fase"
foto = "foto"
hav = "hav"
jus = "jus"
lokal = "lokal"
makin = "makin"
mata = "mata"
minum = "minum"
mis = "mis"
ot = "ot"
paket = "paket"
persisten = "persisten"
poin = "poin"
rute = "rute"
samping = "samping"
serebral = "serebral"
sistem = "sistem"
standar = "standar"
studi = "studi"
tak = "tak"
teh = "teh"
tipe = "tipe"
vas = "vas"
vektor = "vektor"
vertikal = "vertikal"